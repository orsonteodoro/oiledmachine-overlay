[package]
name = "window_pet"
version = "0.0.9"
description = "Window Pet"
authors = ["SeakMengs"]
license = "MIT"
repository = "https://github.com/SeakMengs/WindowPet"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] } # removed macos-private-api
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.154"
mouse_position = "0.1.3"
log = "0.4.21"
open = "5.0.1"
tokio = "1.35.1"
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.8.4" }
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.7.1" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.10.1" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.4.0" }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.6.0" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.5.5" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.5.0" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", version = "2.14.1" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
